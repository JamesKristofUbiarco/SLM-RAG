[project]
name = "proyecto-slm"
version = "0.1.0"
description = "Local RAG System with Whisper and Ollama"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic-settings>=2.2.1",
    "python-multipart>=0.0.9",
    "torch",
    "torchvision",
    "torchaudio",
    "whisperx",
    "jinja2>=3.1.3",
    "imageio-ffmpeg>=0.6.0",
    "openai-whisper>=20250625",
    "psutil>=7.2.2",
    "sentence-transformers==2.7.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "ctranslate2==4.7.0",
    "docling>=2.113.0",
    "pillow>=12.3.0",
    "yt-dlp>=2026.7.4",
    "duckduckgo-search>=8.1.1",
    "ddgs>=9.14.4",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
whisperx = { git = "https://github.com/m-bain/whisperx.git" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]
override-dependencies = [
    "numba>=0.60.0",
    "llvmlite>=0.43.0"
]
